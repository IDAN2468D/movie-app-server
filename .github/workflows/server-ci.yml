name: Server CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: |
          if [ -d "./server" ]; then cd ./server; fi
          npm ci

      - name: Type Check
        run: |
          if [ -d "./server" ]; then cd ./server; fi
          npx tsc

      - name: Run Tests
        run: |
          if [ -d "./server" ]; then cd ./server; fi
          npm test
